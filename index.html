<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Librogame Hub - Oltre il quarto mondo</title>
    <!-- Richiama il file dello stile -->
    <link rel="stylesheet" href="stile.css">
</head>
<body class="theme-dark-fantasy">

    <!-- 1. HOME SCREEN -->
    <div id="homeScreen" class="screen active">
        <header>
            <div id="modeIndicator" class="mode-indicator" onclick="openPasswordModal()">Player Mode</div>
            <div class="header-title">Biblioteca Librogame</div>
            <button class="header-btn" onclick="openThemeModal()">🎨 Tema</button>
        </header>
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h2 style="font-size: 20px; color: var(--text-main);">Racconti Disponibili</h2>
                    <button class="btn" style="padding: 6px 12px; font-size: 13px;" onclick="importSaveGameCSVPrompt()">📂 Carica</button>
                </div>
                <span id="bookCount" style="font-size: 13px; color: var(--text-muted);">0 titoli</span>
            </div>
            <div id="bookListContainer"></div>
        </div>
    </div>

    <!-- 2. GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <header>
            <button class="header-btn" onclick="toggleDrawer(true)">☰ Menu</button>
            <div id="gameChapterTitle" class="header-title">Capitolo</div>
            <div style="width: 50px;"></div>
        </header>
        <!-- L'intera area di testo + scelte scrollabile -->
        <div class="game-scroll-area" id="gameScrollArea">
            <div class="game-text" id="gameStoryText"></div>
            <div class="choices-box" id="gameChoicesContainer"></div>
        </div>
    </div>

    <!-- DRAWER MENU -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
    <div class="drawer" id="gameDrawer">
        <div class="drawer-title">Menu Gioco</div>
        <button class="drawer-item" onclick="toggleDrawer(false); openStatsModal()">🛡️ Stats</button>
        <button class="drawer-item" onclick="toggleDrawer(false); openThemeModal()">🎨 Temi Visivi</button>
        <button class="drawer-item" onclick="toggleDrawer(false); exportSaveGameCSV()">💾 Salva Partita</button>
        <button class="drawer-item" onclick="toggleDrawer(false); importSaveGameCSVPrompt()">📂 Carica Partita</button>
        <button class="drawer-item" onclick="toggleDrawer(false); location.reload()" style="color: var(--accent-gold); border-color: var(--accent-gold);">🏠 Home</button>
        <button class="drawer-item" onclick="toggleDrawer(false); confirmResetProgress()" style="color: var(--fail-color); border-color: var(--fail-color); margin-top: auto;">🔄 Reset Totale</button>
    </div>

    <!-- 3. ADMIN / EDITOR SCREEN -->
    <div id="adminScreen" class="screen">
        <header>
            <button class="header-btn" onclick="openNodeEditor(null)">➕ Nuovo Nodo</button>
            <div id="adminHeaderTitle" class="header-title">Editor Spazioso</div>
            <button class="header-btn" onclick="returnToHome()" style="color:var(--accent-gold); font-weight:bold;">💾 Fine</button>
        </header>
        <div class="container" id="adminNodeListContainer"></div>
    </div>

    <!-- MODALI (Finestre a comparsa) -->
    <div class="modal" id="nodeEditorModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-title" id="nodeEditorModalTitle">Modifica Capitolo / Pagina</div>
            <label>ID Nodo (es: 1.1.a)</label><input type="text" id="editNodeId" placeholder="1.1.a">
            <label>Titolo Banner</label><input type="text" id="editNodeTitle" placeholder="Capitolo 1.1.a">
            <label>Testo Narrativo</label><textarea id="editNodeText" rows="6" placeholder="Scrivi il testo..."></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px 0;">
                <span style="font-size:14px; font-weight:bold; color:var(--accent-gold);">Scelte, Modifiche e Skill Points</span>
                <button class="btn" style="padding:6px 12px; font-size:12px;" onclick="addChoiceRow()">+ Aggiungi Scelta</button>
            </div>
            <div id="choicesListContainer" style="display:flex; flex-direction:column; gap:10px; max-height:220px; overflow-y:auto; margin-bottom:16px;"></div>
            <div class="row-end">
                <button class="btn" onclick="closeModal('nodeEditorModal')">Annulla</button>
                <button class="btn btn-gold" onclick="saveNodeFromEditor()">Salva Nodo</button>
            </div>
        </div>
    </div>

    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-title" id="statsModalTitle">Scheda Personaggio</div>
            <div style="background: rgba(229, 169, 60, 0.1); border: 1px solid var(--accent-gold); padding: 10px; border-radius: 8px; margin-bottom: 14px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:14px; color:var(--accent-gold); font-weight:bold;">Punti Abilità (SP):</span>
                <span id="availableSkillPoints" style="font-size:18px; color:var(--text-main); font-weight:bold;">0</span>
            </div>
            <div id="statsListContainer"></div>
            <div id="statConfirmContainer" style="display:none; margin-top:12px;">
                <button class="btn btn-gold" style="width:100%; margin-bottom:8px;" onclick="confirmSkillPoints()">Conferma Spesa Punti</button>
                <button class="btn" style="width:100%; font-size:12px;" onclick="cancelSkillPoints()">Annulla modifiche</button>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn" style="flex:1;" onclick="exportSaveGameCSV()">Salva su File</button>
                <button class="btn" style="flex:1;" onclick="closeModal('statsModal')">Chiudi</button>
            </div>
        </div>
    </div>

    <div class="modal" id="themeModal">
        <div class="modal-content">
            <div class="modal-title">Scegli Tema Visivo</div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                <button class="btn" onclick="setTheme('theme-dark-fantasy')">🌌 Dark Fantasy (Default)</button>
                <button class="btn" onclick="setTheme('theme-pergamena')">📜 Pergamena Antica</button>
                <button class="btn" onclick="setTheme('theme-cyberpunk')">⚡ Cyberpunk Neon</button>
                <button class="btn" onclick="setTheme('theme-forest')">🌲 Forest / Natura</button>
                <button class="btn" onclick="setTheme('theme-blood-moon')">🩸 Blood Moon</button>
            </div>
            <button class="btn" style="width:100%;" onclick="closeModal('themeModal')">Chiudi</button>
        </div>
    </div>

    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-title">Accesso Admin</div>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Inserisci la parola d'ordine:</p>
            <input type="password" id="adminPwdInput" placeholder="Password (Magium)...">
            <div class="row-end" style="margin-top:10px;">
                <button class="btn" onclick="closeModal('passwordModal')">Annulla</button>
                <button class="btn btn-gold" onclick="verifyAdminPassword()">Accedi</button>
            </div>
        </div>
    </div>

    <div class="modal" id="createBookModal">
        <div class="modal-content">
            <div class="modal-title">Crea Nuovo Libro</div>
            <label>Titolo del Libro</label><input type="text" id="newBookTitle" placeholder="Es. Oltre il quarto mondo">
            <label>Descrizione</label><textarea id="newBookDesc" rows="3" placeholder="Trama..."></textarea>
            <label>Protagonista</label><input type="text" id="newBookProtagonist" value="Sabrina">
            <div class="row-end" style="margin-top:10px;">
                <button class="btn" onclick="closeModal('createBookModal')">Annulla</button>
                <button class="btn btn-gold" onclick="saveNewBook()">Crea</button>
            </div>
        </div>
    </div>

    <!-- Richiamo i file Javascript (Prima la storia, poi il motore di gioco) -->
    <script src="storia.js"></script>
    <script src="app.js"></script>

</body>
</html>
